name: Publish

# Publishes the extension to the Open VSX Registry when a version tag is pushed.
#
# Requires the `OPEN_VSX_TOKEN` secret to be configured in the repository
# settings (Settings -> Secrets and variables -> Actions -> New repository secret).
# Create the token at https://open-vsx.org/user-settings/tokens

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: 'url.https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'
          GIT_CONFIG_KEY_1: 'url.https://github.com/.insteadOf'
          GIT_CONFIG_VALUE_1: 'git@github.com:'
        run: npm ci

      - name: Compile & Package
        run: |
          npm run compile
          npx vsce package --no-dependencies

      - name: Publish to Open VSX
        run: npx ovsx publish *.vsix -p ${{ secrets.OPEN_VSX_TOKEN }}
